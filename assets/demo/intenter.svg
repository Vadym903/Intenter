<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Intenter demo: approve once, auto-allowed next session, blocked with an explanation after the script changes</title>
  <desc id="desc">Intenter is a local, deterministic permission layer for AI coding agents that approves what a command actually does, not the string it was typed as. An illustration of a scripted session against a fixture project.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #21262d; }
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #e6edf3; }
      .dim { fill: #8b949e; }
      .prompt { fill: #58a6ff; }
      .ok { fill: #3fb950; }
      .warn { fill: #d29922; }
      .bad { fill: #f85149; }
      .cap { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; fill: #e6edf3; font-weight: 600; }
      .sub { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="640" rx="12"/>

  <text class="cap" x="40" y="42">1 · Approve once</text>
  <rect class="frame" x="40" y="56" width="1120" height="150" rx="8"/>
  <rect class="bar" x="41" y="57" width="1118" height="26" rx="8"/>
  <text class="sub" x="56" y="75">session 1 — Claude Code asks, Intenter explains</text>
  <text class="t" x="56" y="110"><tspan class="prompt">$</tspan> npm run cleanup</text>
  <text class="t dim" x="56" y="134">Intenter [event 1207]: npm run cleanup → rm -rf ./dist · DELETE(recursive) ./dist [WORKSPACE_GENERATED] · no approval yet</text>
  <text class="t" x="56" y="158">Claude: Allow? <tspan class="ok">▸ Yes, and don't ask again for `npm run cleanup` in ~/proj</tspan></text>
  <text class="t dim" x="56" y="182">approval 42 created: DELETE ./dist [WORKSPACE_GENERATED], fingerprint npm-script:package.json#scripts.cleanup</text>

  <text class="cap" x="40" y="246">2 · Next session: no prompt</text>
  <rect class="frame" x="40" y="260" width="1120" height="110" rx="8"/>
  <rect class="bar" x="41" y="261" width="1118" height="26" rx="8"/>
  <text class="sub" x="56" y="279">session 2 — same command, same effects</text>
  <text class="t" x="56" y="314"><tspan class="prompt">$</tspan> npm run cleanup</text>
  <text class="t" x="56" y="338"><tspan class="ok">✓ allowed</tspan> <tspan class="dim">— matched approval 42 (APPROVAL_MATCH), fingerprint unchanged</tspan></text>

  <text class="cap" x="40" y="410">3 · The script changes — the approval stops matching</text>
  <rect class="frame" x="40" y="424" width="1120" height="176" rx="8"/>
  <rect class="bar" x="41" y="425" width="1118" height="26" rx="8"/>
  <text class="sub" x="56" y="443">package.json: "cleanup": "rm -rf ./dist"  →  "rm -rf ~/Documents"</text>
  <text class="t" x="56" y="478"><tspan class="prompt">$</tspan> npm run cleanup</text>
  <text class="t" x="56" y="502"><tspan class="bad">✗ BLOCKED</tspan> <tspan class="dim">— hard rule R2: recursive delete of HOME (~/Documents)</tspan></text>
  <text class="t dim" x="56" y="526">approval 42 no longer covers this action:</text>
  <text class="t warn" x="56" y="550">  npm-script:package.json#scripts.cleanup changed · target ./dist → ~/Documents · scope WORKSPACE_GENERATED → HOME</text>
  <text class="t dim" x="56" y="574">intenter history show 1209  — full explanation, no LLM involved, nothing left your machine</text>

  <text class="sub" x="40" y="626">An illustration of the scripted session in assets/demo/session.sh, run against a fixture project (~/proj). Paths and names are fixtures.</text>
</svg>

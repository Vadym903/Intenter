<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Intenter — approve what a command does, not what it is called</title>
  <desc id="desc">Intenter is a local, deterministic permission layer for AI coding agents that approves what a command actually does, not the string it was typed as.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 76px; font-weight: 700; fill: #e6edf3; }
      .line { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 600; fill: #e6edf3; }
      .lead { fill: #58a6ff; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 24px; fill: #8b949e; }
      .foot { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 22px; fill: #8b949e; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; fill: #8b949e; }
      .link { fill: #58a6ff; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 19px; fill: #e6edf3; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .mark { fill: none; stroke: #3fb950; stroke-width: 6; stroke-linejoin: round; }
      .tick { fill: none; stroke: #3fb950; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .cue { fill: #3fb950; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="640"/>

  <path class="mark" d="M116 64 L160 84 L160 132 C160 160 140 178 116 188 C92 178 72 160 72 132 L72 84 Z"/>
  <path class="tick" d="M94 124 L110 142 L140 104"/>

  <text class="name" x="196" y="153">Intenter</text>

  <text class="line" x="72" y="272">Stop approving command strings.</text>
  <text class="line lead" x="72" y="328">Approve what commands actually do.</text>

  <text class="sub" x="72" y="388">Resolves what a command really does — and re-asks the moment it changes.</text>

  <rect class="panel" x="72" y="430" width="1136" height="72" rx="10"/>
  <text class="code" x="100" y="474"><tspan class="cue">$</tspan> curl -fsSL https://raw.githubusercontent.com/Vadym903/Intenter/main/install.sh | sh</text>

